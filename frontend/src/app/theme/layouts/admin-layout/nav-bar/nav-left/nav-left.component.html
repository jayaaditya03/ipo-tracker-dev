<ul class="list-unstyled">
  <li class="pc-h-item pc-sidebar-collapse">
    <button type="button" title="Collapse menu" class="pc-head-link ms-0 bg-transparent border-0"
      [ngClass]="{ on: navCollapsed() }" (click)="navCollapse()">
      @if (navCollapsed() === true) {
        <i antIcon type="menu-unfold" theme="outline"></i>
      } @else {
        <i antIcon type="menu-fold" theme="outline"></i>
      }
    </button>
  </li>
  <li class="pc-h-item pc-sidebar-popup">
    <button type="button" title="Open menu" class="pc-head-link ms-0 bg-transparent border-0" (click)="navCollapsedMob()">
      <i antIcon type="menu-fold" theme="outline"></i>
    </button>
  </li>
</ul>
